# Copy to .github/workflows/ci.yml in MyHealthApp and MeaningIt.
# Delete any step whose npm script doesn't exist in that repo's package.json.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint --if-present
      - run: npm test --if-present -- --run
      - run: npm run build
